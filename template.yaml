AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: SmartHire API Gateway + Lambda (Service Layer)

Parameters:
  ApiStageName:
    Type: String
    Default: Prod
  AllowedCorsOrigin:
    Type: String
  VpcSecurityGroupId:
    Type: String
  PrivateSubnetIdA:
    Type: String
  PrivateSubnetIdB:
    Type: String
  DbSecretArn:
    Type: String
  DbHost:
    Type: String
  DbPort:
    Type: String
    Default: "5432"
  DbName:
    Type: String
  DbUser:
    Type: String
  DbPassword:
    Type: String
  DbResourceId:
    Type: String
  DbUsername:
    Type: String
  CognitoRegion:
    Type: String
  CognitoUserPoolId:
    Type: String
  CognitoClientId:
    Type: String
  AspNetCoreEnvironment:
    Type: String
    Default: Production
  AdminEmail:
    Type: String
  AdminPassword:
    Type: String
    NoEcho: true
  EnableSwagger:
    Type: String
    Default: "true"

Resources:
  SmartHireApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref ApiStageName
      EndpointConfiguration: REGIONAL
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !Sub "arn:aws:cognito-idp:${CognitoRegion}:${AWS::AccountId}:userpool/${CognitoUserPoolId}"
            Identity:
              Header: Authorization
      Cors:
        AllowMethods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: !Sub "'${AllowedCorsOrigin}'"
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          LoggingLevel: INFO
          MetricsEnabled: true
      DefinitionBody:
        swagger: "2.0"
        info:
          title: SmartHireApi
          version: "1.0"
        paths: {}
        x-amazon-apigateway-gateway-responses:
          DEFAULT_4XX:
            responseParameters:
              gatewayresponse.header.Access-Control-Allow-Origin: "'${AllowedCorsOrigin}'"
              gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
              gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
          DEFAULT_5XX:
            responseParameters:
              gatewayresponse.header.Access-Control-Allow-Origin: "'${AllowedCorsOrigin}'"
              gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
              gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"

  SmartHireApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: "./The Hirelo/"
      Handler: The_Hirelo::The_Hirelo.LambdaEntryPoint::FunctionHandlerAsync
      Runtime: dotnet8
      MemorySize: 512
      Timeout: 30
      VpcConfig:
        SecurityGroupIds:
          - !Ref VpcSecurityGroupId
        SubnetIds:
          - !Ref PrivateSubnetIdA
          - !Ref PrivateSubnetIdB
      Environment:
        Variables:
          DB_HOST: !Ref DbHost
          DB_PORT: !Ref DbPort
          DB_NAME: !Ref DbName
          DB_USER: !Ref DbUser
          DB_PASSWORD: !Ref DbPassword
          AWS__Cognito__Region: !Ref CognitoRegion
          AWS__Cognito__UserPoolId: !Ref CognitoUserPoolId
          AWS__Cognito__ClientId: !Ref CognitoClientId
          ASPNETCORE_ENVIRONMENT: !Ref AspNetCoreEnvironment
          ADMIN_EMAIL: !Ref AdminEmail
          ADMIN_PASSWORD: !Ref AdminPassword
          ALLOWED_CORS_ORIGIN: !Ref AllowedCorsOrigin
          ENABLE_SWAGGER: !Ref EnableSwagger
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: "rds-db:connect"
              Resource: !Sub "arn:aws:rds-db:${CognitoRegion}:${AWS::AccountId}:dbuser:${DbResourceId}/${DbUsername}"
      Events:
        RootApi:
          Type: Api
          Properties:
            RestApiId: !Ref SmartHireApi
            Path: /
            Method: ANY
        ProxyApi:
          Type: Api
          Properties:
            RestApiId: !Ref SmartHireApi
            Path: /{proxy+}
            Method: ANY

Outputs:
  ApiUrl:
    Value: !Sub "https://${SmartHireApi}.execute-api.${AWS::Region}.amazonaws.com/${ApiStageName}/"
