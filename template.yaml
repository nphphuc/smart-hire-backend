AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: SmartHire API Gateway + Lambda (Service Layer)

Parameters:
  ApiStageName:
    Type: String
    Default: Prod
  AllowedCorsOrigin:
    Type: String
    Default: https://smarthire-ai.org
  VpcSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  PrivateSubnetIdA:
    Type: AWS::EC2::Subnet::Id
  PrivateSubnetIdB:
    Type: AWS::EC2::Subnet::Id
  DbSecretArn:
    Type: String
  DbResourceId:
    Type: String
  DbUsername:
    Type: String
    Default: smarthire_admin
  CognitoRegion:
    Type: String
    Default: ap-southeast-1
  CognitoUserPoolId:
    Type: String
  CognitoClientId:
    Type: String
  AspNetCoreEnvironment:
    Type: String
    Default: Production
  AdminEmail:
    Type: String
    Default: admin@hirelo.com
  AdminPassword:
    Type: String
    NoEcho: true

Resources:
  SmartHireApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub smarthire-api-${ApiStageName}
      StageName: !Ref ApiStageName
      EndpointConfiguration: REGIONAL
      Cors:
        AllowMethods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: !Sub "'${AllowedCorsOrigin}'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !Sub "arn:aws:cognito-idp:${CognitoRegion}:${AWS::AccountId}:userpool/${CognitoUserPoolId}"
            Identity:
              Header: Authorization
              ReauthorizeEvery: 0
      # DefinitionBody:
        # swagger: "2.0"
        # info:
          # title: SmartHireApi
          # version: "1.0"
        # paths: {}
        # x-amazon-apigateway-gateway-responses:
          # DEFAULT_4XX:
            # responseParameters:
              # gatewayresponse.header.Access-Control-Allow-Origin: "'${AllowedCorsOrigin}'"
              # gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
              # gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
          # DEFAULT_5XX:
            # responseParameters:
              # gatewayresponse.header.Access-Control-Allow-Origin: "'${AllowedCorsOrigin}'"
              # gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
              # gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
      MethodSettings:
        - ResourcePath: /*
          HttpMethod: "*"
          LoggingLevel: INFO
          DataTraceEnabled: true
          MetricsEnabled: true

  SmartHireApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: "./The Hirelo/"
      Handler: The_Hirelo::TheHirelo.Function::FunctionHandler
      Runtime: dotnet8
      MemorySize: 512
      Timeout: 30
      VpcConfig:
        SecurityGroupIds:
          - !Ref VpcSecurityGroupId
        SubnetIds:
          - !Ref PrivateSubnetIdA
          - !Ref PrivateSubnetIdB
      Environment:
        Variables:
          DB_HOST: "{{resolve:secretsmanager:${DbSecretArn}:SecretString:host}}"
          DB_PORT: "{{resolve:secretsmanager:${DbSecretArn}:SecretString:port}}"
          DB_NAME: "{{resolve:secretsmanager:${DbSecretArn}:SecretString:dbname}}"
          DB_USER: "{{resolve:secretsmanager:${DbSecretArn}:SecretString:username}}"
          DB_PASSWORD: "{{resolve:secretsmanager:${DbSecretArn}:SecretString:password}}"
          AWS__Cognito__Region: !Ref CognitoRegion
          AWS__Cognito__UserPoolId: !Ref CognitoUserPoolId
          AWS__Cognito__ClientId: !Ref CognitoClientId
          ASPNETCORE_ENVIRONMENT: !Ref AspNetCoreEnvironment
          ADMIN_EMAIL: !Ref AdminEmail
          ADMIN_PASSWORD: !Ref AdminPassword
          # ALLOWED_CORS_ORIGIN: !Ref AllowedCorsOrigin
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: "rds-db:connect"
              Resource: !Sub "arn:aws:rds-db:${CognitoRegion}:${AWS::AccountId}:dbuser:${DbResourceId}/${DbUsername}"
      Events:
        RootApi:
          Type: Api
          Properties:
            RestApiId: !Ref SmartHireApi
            Path: /
            Method: ANY
        ProxyApi:
          Type: Api
          Properties:
            RestApiId: !Ref SmartHireApi
            Path: /{proxy+}
            Method: ANY

Outputs:
  ApiId:
    Description: API Gateway REST API ID
    Value: !Ref SmartHireApi
  ApiUrl:
    Description: API Gateway base URL
    Value: !Sub "https://${SmartHireApi}.execute-api.${AWS::Region}.amazonaws.com/${ApiStageName}/"
